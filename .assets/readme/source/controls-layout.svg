<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="356" viewBox="0 0 1200 356" role="img" aria-labelledby="title desc">
<title id="title">LinkLens 键盘操作</title><desc id="desc">1–7 切换页面，/ 输入 IP，r 重新检测，i 隐藏 IP；右侧为空白键帽概念插画。</desc>
<rect width="1200" height="356" rx="24" fill="#f4faf8"/>
<text x="56" y="55" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" font-weight="600" fill="#50716b">03 / AT YOUR FINGERTIPS</text><text x="56" y="119" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="44" font-weight="650" fill="#193d38">常用操作，几次按键。</text><rect x="56" y="169" width="78" height="52" rx="12" fill="#e1efea"/><text x="74" y="203" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="600" fill="#216659">1–7</text><text x="155" y="203" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#365b54">切换页面</text><rect x="342" y="169" width="78" height="52" rx="12" fill="#e1efea"/><text x="360" y="203" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="600" fill="#216659">/</text><text x="441" y="203" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#365b54">输入 IP</text><rect x="56" y="251" width="78" height="52" rx="12" fill="#e1efea"/><text x="74" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="600" fill="#216659">r</text><text x="155" y="285" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#365b54">重新检测</text><rect x="342" y="251" width="78" height="52" rx="12" fill="#e1efea"/><text x="360" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="600" fill="#216659">i</text><text x="441" y="285" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#365b54">隐藏 IP</text><g id="generated-keycaps"><image x="710" y="8" width="440" height="340" preserveAspectRatio="xMidYMid meet" xlink:href="controls-subject.png"/></g>
