[package]
name = "linklens"
version = "0.1.1"
edition = "2024"
default-run = "linklens"
license = "MIT"
description = "Interactive terminal IP inspection tool"
repository = "https://github.com/mel0nyrame/LinkLens"

[lib]
name = "network_tui"

[dependencies]
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
getrandom = "0.3"
hickory-resolver = { version = "0.26", features = ["system-config", "tokio"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
url = "2"
webpki-roots = "0.26"
