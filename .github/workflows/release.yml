name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag, version and handwritten notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/check_release.py
      - run: python3 .github/scripts/check_docs.py
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Rust
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$BUILD_TARGET"
      - name: Prepare Linux linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
      - name: Use static Windows C runtime
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Test and build both commands
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_TARGET: ${{ matrix.target }}
        run: python .github/scripts/build_release.py
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_TARGET: ${{ matrix.target }}
        run: python .github/scripts/package_release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linklens-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish with handwritten notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "LinkLens $RELEASE_TAG" --notes-file ".github/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "LinkLens $RELEASE_TAG" --notes-file ".github/releases/$RELEASE_TAG.md"
  verify-published:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published assets and verify all five checksums
        run: |
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/linklens-release"
          cd "$RUNNER_TEMP/linklens-release"
          python3 - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          targets = ("x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl",
                     "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc")
          expected = {f"linklens-{tag}-{target}.{'zip' if 'windows' in target else 'tar.gz'}"
                      for target in targets}
          lines = [line.split() for line in Path("SHA256SUMS").read_text().splitlines()]
          assert len(lines) == 5 and all(len(line) == 2 for line in lines), lines
          assert {line[1] for line in lines} == expected, lines
          assert {path.name for path in Path.cwd().iterdir()} == expected | {"SHA256SUMS"}
          PY
          sha256sum --check SHA256SUMS
      - name: Install published Linux package and verify both command identities
        env:
          LINKLENS_VERSION: ${{ github.ref_name }}
        run: |
          export LINKLENS_INSTALL_DIR="$RUNNER_TEMP/linklens-installed"
          sh install.sh
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          expected = {"version": os.environ["RELEASE_TAG"][1:],
                      "target": "x86_64-unknown-linux-musl"}
          for name in ("linklens", "llens"):
              command = Path(os.environ["LINKLENS_INSTALL_DIR"]) / name
              output = subprocess.run([str(command), "--linklens-update-identity"],
                                      check=True, capture_output=True, text=True, timeout=10)
              assert json.loads(output.stdout) == expected, output.stdout
              assert not output.stderr, output.stderr
          PY
